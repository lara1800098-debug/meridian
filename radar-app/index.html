<title>Meridian Radar</title>
<link rel="artifact-thumbnail" href="thumb.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a nautical sea-chart — graticule paper, a radar "scope" as the hero, instruments (panels) docked beside it. */
:root{
  --paper:#eef2f3; --panel:#fbfcfc; --panel-2:#e4eaec; --line:#cdd7db; --grid:rgba(15,34,51,.07);
  --ink:#0f2233; --ink-2:#3d5262; --ink-3:#6c7f8c;
  --sea:#1d6f7b; --sea-soft:rgba(29,111,123,.12);
  --brass:#c27417; --brass-soft:rgba(194,116,23,.14);
  --good:#1f7a4d; --warn:#a86a00; --bad:#b8323b;
  --scope:#0f2a38; --scope-ink:#bfe3e6; --scope-line:rgba(191,227,230,.16);
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(15,34,51,.06),0 8px 24px rgba(15,34,51,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0a141c; --panel:#101d27; --panel-2:#172733; --line:#22384a; --grid:rgba(191,227,230,.05);
  --ink:#e6eef1; --ink-2:#a9bcc6; --ink-3:#7a909c; --sea:#4fb3bf; --sea-soft:rgba(79,179,191,.14);
  --brass:#f0a447; --brass-soft:rgba(240,164,71,.15); --good:#53c08a; --warn:#e5ae46; --bad:#f0737b;
  --scope:#061017; --scope-ink:#bfe3e6; --scope-line:rgba(191,227,230,.12); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0a141c; --panel:#101d27; --panel-2:#172733; --line:#22384a; --grid:rgba(191,227,230,.05);
  --ink:#e6eef1; --ink-2:#a9bcc6; --ink-3:#7a909c; --sea:#4fb3bf; --sea-soft:rgba(79,179,191,.14);
  --brass:#f0a447; --brass-soft:rgba(240,164,71,.15); --good:#53c08a; --warn:#e5ae46; --bad:#f0737b;
  --scope:#061017; --scope-ink:#bfe3e6; --scope-line:rgba(191,227,230,.12); --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:48px 48px}
html[lang="ar"] body{font-family:var(--f-ar)}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--f-ar)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.mark{display:flex;align-items:center;gap:10px;min-width:0}
.mark b{font-family:var(--f-display);font-size:18px;letter-spacing:-.01em}
.mark small{display:block;color:var(--ink-3);font-size:11px;line-height:1.2}
.tabs{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:999px;overflow-x:auto;max-width:100%}
.tabs a{padding:6px 14px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tools{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chipbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.status{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.live{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
html[lang="ar"] .label{letter-spacing:0}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select{max-width:100%}
#szDeal{min-width:0;flex:1 1 160px}
kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-3);background:var(--panel)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.leader{background:var(--brass-soft);color:var(--brass)}
.pill.team{background:var(--sea-soft);color:var(--sea)}
.pill.mute{background:var(--panel-2);color:var(--ink-2)}
.pill.good{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.notice{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--brass-soft);color:var(--ink);font-size:13px}

/* RADAR VIEW */
.radar-view{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media (max-width:980px){.radar-view{grid-template-columns:1fr}}
.scope{background:var(--scope);color:var(--scope-ink);border-radius:18px;padding:18px;position:relative;overflow:hidden;border:1px solid var(--line)}
.scope header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.scope h1{font-size:clamp(22px,3vw,30px);color:#fff;letter-spacing:-.02em}
html[data-theme="light"] .scope h1{color:#fff}
.scope .meta{font-size:12px;color:color-mix(in srgb,var(--scope-ink) 75%,transparent);margin-top:4px}
.scope svg{display:block;width:100%;max-width:640px;margin:8px auto 0;aspect-ratio:1/1;height:auto}
.ring{fill:none;stroke:var(--scope-line)}
.ring-label{fill:color-mix(in srgb,var(--scope-ink) 60%,transparent);font:500 10px var(--f-mono)}
.wedge-label{fill:color-mix(in srgb,var(--scope-ink) 80%,transparent);font:600 10.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase}
.spoke{stroke:var(--scope-line)}
.sweep{transform-origin:300px 300px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.blip{cursor:pointer;transition:transform .15s}
.blip circle.core{stroke:#061017;stroke-width:1.5}
.blip.leader circle.core{fill:#f0a447}
.blip.team circle.core{fill:#59c3cf}
.blip.handled circle.core{fill:#55666f}
.blip .halo{fill:none;stroke:#f0a447;opacity:0}
.blip.leader:not(.handled) .halo{animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{opacity:.8;r:6}100%{opacity:0;r:22}}
.blip.sel circle.core{stroke:#fff;stroke-width:3}
.blip:hover circle.core{stroke:#fff}
@media (prefers-reduced-motion:reduce){.sweep,.blip .halo{animation:none!important}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;justify-content:center;color:color-mix(in srgb,var(--scope-ink) 80%,transparent)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.filters button{border:1px solid var(--scope-line);background:transparent;color:var(--scope-ink);border-radius:999px;padding:4px 11px;font-size:12px}
.filters button[aria-pressed="true"]{background:var(--scope-ink);color:var(--scope)}
.tip{position:absolute;pointer-events:none;background:#fff;color:#0f2233;font-size:12px;padding:6px 9px;border-radius:8px;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:5}

.queue{margin-top:14px;max-height:340px;overflow:auto;border-top:1px solid var(--scope-line);padding-top:8px}
.qrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 6px;border-radius:9px;cursor:pointer;color:var(--scope-ink);background:none;border:0;width:100%;text-align:start}
.qrow:hover,.qrow.sel{background:rgba(191,227,230,.08)}
.qrow .sc{font-family:var(--f-mono);font-weight:500;text-align:center;border-radius:7px;padding:3px 0;background:rgba(191,227,230,.1)}
.qrow.leader .sc{background:rgba(240,164,71,.22);color:#f6c27f}
.qrow .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.qrow .s{font-size:11px;opacity:.7}
.qrow.handled{opacity:.45}

/* play card */
.card{padding:20px;display:flex;flex-direction:column;gap:16px}
.card h2{font-size:21px;line-height:1.25;letter-spacing:-.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.why li{margin:0 0 6px;padding-inline-start:4px}
.why{margin:0;padding-inline-start:18px}
.cite{font-family:var(--f-mono);font-size:11px;color:var(--sea);text-decoration:none;border:1px solid var(--sea-soft);border-radius:5px;padding:0 5px;margin-inline-start:4px;white-space:nowrap}
.cite:hover{background:var(--sea-soft)}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.gauge{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.gauge .v{font-family:var(--f-mono);font-size:22px;font-weight:500}
.gauge .bar2{height:4px;background:var(--panel-2);border-radius:4px;margin:6px 0 6px;overflow:hidden}
.gauge .bar2 span{display:block;height:100%;background:var(--sea);border-radius:4px}
.gauge p{margin:0;font-size:11.5px;color:var(--ink-3);line-height:1.35}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.split{grid-template-columns:1fr}}
.box{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.box ul{margin:6px 0 0;padding-inline-start:18px}
.value{font-family:var(--f-mono);font-size:20px;font-weight:500}
.tag-fact{color:var(--sea)} .tag-sug{color:var(--brass)}
.outreach pre{white-space:pre-wrap;font-family:inherit;background:var(--panel-2);border-radius:10px;padding:12px;margin:8px 0 0;max-height:300px;overflow:auto;font-size:13.5px}
.seg{display:inline-flex;background:var(--panel-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;font-size:12.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.reasons button{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 10px;font-size:12px}
.reasons button:hover{border-color:var(--bad);color:var(--bad)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* MARKETS / OPPS / EXPECTED */
.pagehead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-top:18px}
.pagehead h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.pagehead p{margin:4px 0 0;color:var(--ink-3);max-width:72ch}
.more{position:relative}
.more summary{list-style:none;cursor:pointer}
.more summary::-webkit-details-marker{display:none}
.morelist{position:absolute;inset-inline-end:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:160px;z-index:25}
.morelist a{padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none}
.morelist a:hover{background:var(--panel-2)}
.mgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
@media (max-width:1150px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.mgrid{grid-template-columns:1fr}}
.mcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.mcard header{display:flex;align-items:center;gap:10px}
.mcard h2{font-size:19px;flex:1}
.mk{font-family:var(--f-mono);font-size:12px;font-weight:500;background:var(--ink);color:var(--panel);border-radius:6px;padding:3px 7px}
.mbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2{font-size:clamp(22px,2.4vw,30px);font-weight:500;line-height:1.1}
.mbar{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--brass))}
.mfacts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:0;font-size:12.5px}
.mfacts dt{color:var(--ink-3)} .mfacts dd{margin:0;font-weight:500}
.mtop{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-align:start;cursor:pointer;font-size:13px}
.linkbtn:hover{text-decoration:underline}
.linkbtn .num{color:var(--brass);margin-inline-end:4px}
.heatmap{border-collapse:separate;border-spacing:6px;min-width:520px;width:100%;margin-top:8px}
.heatmap th{font-size:12.5px;text-align:start;font-weight:600}
.heat{width:100%;min-height:46px;border-radius:9px;border:1px solid var(--line);font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--ink);background:color-mix(in srgb,var(--c) calc(var(--a)*70%),var(--panel))}
.heat:hover{outline:2px solid var(--c)}
.fbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.fbar input[type=search],.fbar select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--panel);min-width:0}
.fbar input[type=search]{flex:1 1 180px;max-width:300px}
.chipbtn.cat[aria-pressed="true"]{background:var(--cc,var(--ink));border-color:var(--cc,var(--ink));color:#fff}
.olayout{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.3fr);gap:16px;margin-top:14px;align-items:start}
@media (max-width:980px){.olayout{grid-template-columns:1fr}}
.olist{max-height:calc(100vh - 110px);overflow:auto;padding:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (max-width:980px){.olist{max-height:420px;position:static}}
.orow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;width:100%;text-align:start;border:0;background:none;padding:9px 8px;border-radius:9px}
.orow:hover,.orow.sel{background:var(--panel-2)}
.orow .sc{font-family:var(--f-mono);font-weight:500;border-radius:8px;padding:6px 0;text-align:center;background:var(--sea-soft);color:var(--sea);align-self:start}
.orow .sc.leader{background:var(--brass-soft);color:var(--brass)}
.orow b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .t2{display:block;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;align-items:center;margin-top:3px;font-size:11.5px;color:var(--ink-3)}
.dots i,.cdot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:2px}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:6px}
.svc{border:1px solid var(--line);border-inline-start:4px solid var(--cc);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.svc span{font-size:12.5px}.svc small{font-size:11.5px;color:var(--ink-3)}
.pocs{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pocs h3,.outreach h3{font-size:15px}
.poclist{list-style:none;margin:0 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.poc{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px dashed var(--line);padding-bottom:6px}
.poc b{font-size:13.5px}.poc small{display:block;font-size:12px;color:var(--ink-3)}
.pocact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn.sm{padding:3px 9px;font-size:12px}
.addc summary{list-style:none;display:inline-flex}
.addc summary::-webkit-details-marker{display:none}
.egrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
@media (max-width:1100px){.egrid{grid-template-columns:1fr}}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;margin:10px 0}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--panel-2)}
.stack i{display:block}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
.qbars{display:flex;gap:12px;align-items:flex-end;height:210px;margin-top:10px}
.qcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;min-width:0}
.qstack{width:100%;max-width:56px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden}
.qstack i{display:block}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{text-align:start;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom:1px solid var(--line);padding:6px}
.tbl td{border-bottom:1px solid var(--line);padding:7px 6px}
.tbl .r{text-align:end}
.small{font-size:12px}

/* LOGOS */
.logos-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-top:18px}
.logos-head h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.02em}
.logos-head p{margin:4px 0 0;color:var(--ink-3)}
.lbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.lbar input[type=search]{border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel);min-width:0;flex:1 1 200px;max-width:340px}
.logos-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);gap:20px;margin-top:16px;align-items:start}
@media (max-width:1000px){.logos-layout{grid-template-columns:1fr}}
.sector{margin-bottom:22px}
.sector-h{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px}
.sector-h h2{font-size:17px}
.sector-h span{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.logo{padding:14px;display:flex;flex-direction:column;gap:10px}
.logo.q{border-color:color-mix(in srgb,var(--brass) 45%,var(--line))}
.logo-top{display:flex;gap:10px;align-items:flex-start}
.mono{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;color:#fff;flex:none}
.logo-top b{display:block;font-size:14.5px;line-height:1.25}
.logo-top small{color:var(--ink-3);font-size:12px}
.checks{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.checks span::before{content:"○ ";color:var(--ink-3)}
.checks span.ok::before{content:"● ";color:var(--good)}
.sell{display:flex;gap:5px;flex-wrap:wrap}
.sell span{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel-2)}
.upd{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.upd li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.upd time{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);white-space:nowrap;padding-top:1px}
.upd a{color:var(--ink);text-decoration:none}
.upd a:hover{text-decoration:underline}
.upd .o{color:var(--ink-3);font-size:11px}
.logo-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.logo-act .btn{padding:5px 10px;font-size:12.5px}
.trends{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);padding:16px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto}
@media (max-width:1000px){.trends{position:static;max-height:none}}
.trend{border-top:1px solid var(--line);padding-top:12px}
.trend:first-of-type{border-top:0;padding-top:0}
.trend h3{font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
.trend h3 span{font-family:var(--f-mono);font-weight:500;color:var(--brass)}
.meter{height:5px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sea),var(--brass))}
.trend .small{font-size:12px;color:var(--ink-3)}
.trend ul{margin:6px 0 0;padding-inline-start:16px;font-size:12.5px}
.trend .chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.trend .chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:1px 8px;font-size:11.5px}
.trend .chips button:hover{border-color:var(--sea);color:var(--sea)}

/* PIPELINE */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-3)}
.kpi input{width:100%;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--panel);margin-top:4px}
.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;margin-top:16px;overflow-x:auto;padding-bottom:6px}
.col{background:color-mix(in srgb,var(--panel-2) 70%,transparent);border-radius:12px;padding:10px;min-height:180px;border:1px dashed transparent}
.col.over{border-color:var(--sea);background:var(--sea-soft)}
.col h3{font-size:13px;display:flex;justify-content:space-between;gap:6px;margin-bottom:8px}
.col h3 span{font-family:var(--f-mono);font-weight:400;color:var(--ink-3);font-size:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 14px;margin-bottom:8px;cursor:grab;position:relative;width:100%;text-align:start;display:block}
.dcard::before{content:"";position:absolute;inset-block:8px;inset-inline-start:5px;width:3px;border-radius:3px;background:var(--good)}
.dcard.watch::before{background:var(--warn)} .dcard.at_risk::before{background:var(--bad)}
.dcard b{display:block;font-size:13px;line-height:1.3}
.dcard .m{font-size:12px;color:var(--ink-3);margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.dcard .why2{font-size:11.5px;color:var(--bad);margin-top:4px}
.dcard.watch .why2{color:var(--warn)}
.closed{margin-top:16px}
.closed summary{cursor:pointer;color:var(--ink-2)}

/* drawer */
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(520px,100%);background:var(--panel);border-inline-start:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) 24px 18px;display:flex;flex-direction:column;gap:14px}
.scrim{position:fixed;inset:0;background:rgba(6,16,23,.35);z-index:35}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select,.field textarea{max-width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.clock{display:flex;align-items:center;gap:12px}
.clock svg{width:54px;height:54px;flex:none}
.clock .track{fill:none;stroke:var(--panel-2);stroke-width:6}
.clock .prog{fill:none;stroke:var(--sea);stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:27px 27px}
.hist{font-size:12px;color:var(--ink-2);margin:0;padding-inline-start:16px}
.hist li{margin-bottom:4px}

/* BRIEF */
.brief{max-width:860px;margin:18px auto 0;padding:28px clamp(18px,4vw,40px)}
.brief .masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:12px;flex-wrap:wrap}
.brief h1{font-size:clamp(26px,4vw,36px);letter-spacing:-.02em}
.brief ol.head{font-size:16.5px;line-height:1.45;padding-inline-start:22px}
.brief ol.head li{margin-bottom:6px}
.brief section{margin-top:22px}
.brief .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:640px){.brief .two{grid-template-columns:1fr}}
.brief .decide{border:2px solid var(--ink);border-radius:12px;padding:16px 18px;background:var(--panel-2)}
.brief li{margin-bottom:6px}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
@media (max-width:560px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{border-top:3px solid var(--sea);padding-top:6px}
.fig .v{font-family:var(--f-mono);font-size:19px;font-weight:500}

/* SIZER */
.sizer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media (max-width:860px){.sizer{grid-template-columns:1fr}}
.slider{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;margin-bottom:12px}
.slider input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--sea)}
.big{font-family:var(--f-mono);font-size:clamp(30px,5vw,44px);font-weight:500;letter-spacing:-.02em}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;box-shadow:var(--shadow)}
.foot{margin-top:28px;font-size:12px;color:var(--ink-3);text-align:center}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
</style>

const stageOf = (k) => STAGES.find((s) => s.k === k) || STAGES[0];

function catsOf(p) {
  const text = `${p.title} ${(p.sources || []).map((s) => s.excerpt || "").join(" ")}`;
  const out = [];
  for (const c of CATS) {
    const off = (p.offers || []).find((o) => c.offers.includes(o));
    if (off) { out.push({ k: c.k, why: L(`Offer fit: ${S.offers[off]?.en || off}`, `حل مناسب: ${S.offers[off]?.ar || off}`), offer: off }); continue; }
    if (c.k === "app") {
      if (APP_WORDS.test(text) || (["new_licence", "funding", "gov_cx_programme"].includes(p.type) && DIGITAL_SECTORS.includes(p.sector)))
        out.push({ k: "app", why: APP_WORDS.test(text) ? L("The news mentions an app, platform or digital service", "الخبر يذكر تطبيقاً أو منصة أو خدمة رقمية") : L("Digital-first sector with a growth or programme signal", "قطاع رقمي مع مؤشر نمو أو برنامج"), offer: "digital_experience" });
      continue;
    }
    if (c.types.includes(p.type)) out.push({ k: c.k, why: L(`Signal: ${(TYPES[p.type] || [p.type])[0]}`, `المؤشر: ${(TYPES[p.type] || [p.type, p.type])[1]}`), offer: c.def });
  }
  if (!out.length) out.push({ k: "cs", why: L("Default: customer operations", "افتراضي: عمليات خدمة العملاء"), offer: "managed_cc" });
  return out;
}
const isOpen = (p) => ["new", "snoozed"].includes(playStatus(p));
const mid = (p) => ((p.low || 0) + (p.high || 0)) / 2;
const seenDate = (p) => p.seen || p.sources?.[0]?.date || null;

/* conversion assumptions (per viewer) */
function assumptions() { try { return { leader: 25, team: 12, watchlist: 5, ...JSON.parse(load("mer_assume", "{}")) }; } catch { return { leader: 25, team: 12, watchlist: 5 }; } }
function expectedOf(p) { return mid(p) * (assumptions()[p.tier] ?? 10) / 100; }
function expectedDeal(d) { const h = health(d).status; return (d.valueUsd || 0) * stageOf(d.stage).p / 100 * (h === "at_risk" ? 0.5 : h === "watch" ? 0.8 : 1); }
function quarterOfDate(d) { const x = new Date(d); return `${x.getFullYear()}-Q${Math.floor(x.getMonth() / 3) + 1}`; }
function oppCloseDate(p) { const s = seenDate(p); const d = s ? new Date(s) : new Date(); d.setDate(d.getDate() + 150); return d.toISOString().slice(0, 10); }
const dealCountry = (d) => d.country || (S.plays.find((p) => p.id === d.playId)?.country) || "AE";

/* ---------- MARKETS ---------- */
function marketStats(c) {
  const opps = S.plays.filter((p) => p.country === c && isOpen(p));
  const all = S.plays.filter((p) => p.country === c);
  const now = Date.now(), wk = 7 * 864e5;
  const last7 = all.filter((p) => seenDate(p) && now - new Date(seenDate(p)) < wk).length;
  const prev7 = all.filter((p) => seenDate(p) && now - new Date(seenDate(p)) >= wk && now - new Date(seenDate(p)) < 2 * wk).length;
  const cats = Object.fromEntries(CATS.map((k) => [k.k, opps.filter((p) => catsOf(p).some((x) => x.k === k.k)).length]));
  const deals = S.deals.filter((d) => (d.status || "open") === "open" && dealCountry(d) === c);
  const days = Array.from({ length: 30 }, (_, i) => { const d0 = new Date(now - (29 - i) * 864e5).toISOString().slice(0, 10); return all.filter((p) => String(seenDate(p) || "").slice(0, 10) === d0).length; });
  return {
    c, opps, cats, deals, last7, prev7, days,
    low: opps.reduce((a, p) => a + (p.low || 0), 0), high: opps.reduce((a, p) => a + (p.high || 0), 0),
    expected: opps.reduce((a, p) => a + expectedOf(p), 0) + deals.reduce((a, d) => a + expectedDeal(d), 0),
    logos: S.logos.filter((l) => l.country === c && l.qualifies).length,
    leader: opps.filter((p) => p.tier === "leader").length,
  };
}
function spark(days) {
  const max = Math.max(1, ...days), w = 4, gap = 2;
  return `<svg viewBox="0 0 ${days.length * (w + gap)} 28" width="100%" height="28" preserveAspectRatio="none" role="img" aria-label="Opportunities per day, last 30 days">${days.map((v, i) => `<rect x="${i * (w + gap)}" y="${28 - Math.max(v ? 3 : 1, (v / max) * 26)}" width="${w}" height="${Math.max(v ? 3 : 1, (v / max) * 26)}" rx="1" fill="${v ? "var(--sea)" : "var(--line)"}"/>`).join("")}</svg>`;
}

function emailTemplate(p, cat, r, lang) {

  const news = p.title;
  if (lang === "ar") {
    const who = r.name ? `${gov ? "سعادة " : ""}${r.name}` : `${gov ? "سعادة " : ""}${ROLE_AR[r.title] || r.title || "[الاسم]"}`;
    const angle = { cs: "رفع جاهزية خدمة المتعاملين وقدرتها على الاستيعاب مع الحفاظ على مستويات الخدمة", auto: "توظيف الذكاء الاصطناعي في خدمة المتعاملين بشكل مسؤول وسريع الأثر", app: "تطوير التطبيق والقنوات الرقمية بحيث تصبح الخدمة الذاتية أسهل وأسرع", consult: "وضع خارطة طريق واضحة لتجربة المتعاملين ومؤشرات قياس أثرها" }[cat];
    return `الموضوع: ${org} — ${o.ar || CAT[cat].ar}\n\n${who}${gov ? " المحترم،\nتحية طيبة وبعد،" : "،\nتحية طيبة،"}\n\nاطلعتُ على ما نُشر مؤخراً: «${news}». ونرى في كونسنتريكس أن هذه المرحلة فرصة مناسبة لـ${angle}.\n\n${o.pitch_ar || ""}\n\nهل يناسبكم لقاء قصير مدته 20 دقيقة خلال الأسبوعين القادمين لعرض تجارب مماثلة في المنطقة ومناقشة أولوياتكم؟\n\n${gov ? "وتفضلوا بقبول فائق الاحترام والتقدير،" : "مع أطيب التحيات،"}\n[اسمك]\nكونسنتريكس`;
  }
  const who = r.name || (r.title ? `[Name], ${r.title}` : "[Name]");

}
async function oppAct(a) {
  const p = S.plays.find((x) => x.id === S.osel); if (!p) return;
  if (a === "accept") {
    const cs = catsOf(p);
    const id = await addDeal({ title: `${p.org || p.title.slice(0, 60)} — ${L(CAT[cs[0].k].en, CAT[cs[0].k].ar)}`, org: p.org || "", country: p.country, cats: cs.map((c) => c.k), valueUsd: Math.round(mid(p)), stage: "identified", source: "meridian", playId: p.id,
      event: p.title.slice(0, 200), nextStep: "First outreach (draft on the opportunity)", nextDate: addDays(3), closeDate: oppCloseDate(p), history0: "Created from opportunity: " + p.title.slice(0, 120) });
    await savePlayState(p.id, { status: "accepted", dealId: id, by: S.me?.id || null, at: new Date().toISOString() });
    toast("✓ " + L("Added to pipeline", "أضيفت إلى خط المبيعات"));
  } else if (a === "snooze") await savePlayState(p.id, { status: "snoozed", by: S.me?.id || null, at: new Date().toISOString() });
  else if (a === "dismiss") await savePlayState(p.id, { status: "dismissed", reason: "not_relevant", by: S.me?.id || null, at: new Date().toISOString() });
}
async function saveContact(org) {
  const c = { org, name: $("#cName").value.trim(), title: $("#cTitle").value.trim(), email: $("#cEmail").value.trim(), phone: $("#cPhone").value.trim(), note: $("#cNote").value.trim(), by: S.me?.id || null, at: new Date().toISOString() };
  if (!c.name) return;
  if (S.db) { try { await S.db.collection("contacts").add(c); } catch (e) { toast(e.message || "Save failed"); } }
  else { c.id = "local-" + Math.random().toString(36).slice(2, 8); S.contacts.push(c); keep("mer_contacts", JSON.stringify(S.contacts)); render(); }
  toast(L("Contact saved", "تم الحفظ"));
}
async function delContact(id) {
  S.contacts = S.contacts.filter((c) => c.id !== id);
  if (S.db && !id.startsWith("local-")) { try { await S.db.collection("contacts").doc(id).delete(); } catch (e) { toast(e.message); } } else keep("mer_contacts", JSON.stringify(S.contacts));
  render();
}
async function draftOpp(btn) {

/* ---------------- SIZER ---------------- */
function erlangC(n, a) { if (n <= a) return 1; let b = 1; for (let k = 1; k <= n; k++) b = (a * b) / (k + a * b); return b / (1 - (a / n) * (1 - b)); }
function agentsFor(cph, aht, sl, sec) { const a = cph * aht / 3600; if (a <= 0) return 0; for (let n = Math.ceil(a); n < a * 3 + 60; n++) { if (1 - erlangC(n, a) * Math.exp(-(n - a) * (sec / aht)) >= sl) return n; } return Math.ceil(a * 3); }
const SZ = { vol: 60000, aht: 300, hours: 12, days: 6, sl: 80, shrink: 30, voice: 70, langs: 2, rate: "AE" };
const RATES = { AE: [2400, 3500], SA: [2600, 3900], EG: [850, 1400], JO: [1100, 1800] };
function sizeCalc() {
  const open = SZ.days * 52 / 12 * SZ.hours, peak = 1.3;
  const vph = SZ.vol * SZ.voice / 100 / open * peak, dph = SZ.vol * (100 - SZ.voice) / 100 / open * peak;
  const voiceA = agentsFor(vph, SZ.aht, SZ.sl / 100, 20), digA = Math.ceil(agentsFor(dph, SZ.aht * 1.4, SZ.sl / 100, 60) / 2);
  const cov = SZ.hours * SZ.days / 40, lang = 1 + Math.max(0, SZ.langs - 1) * 0.08;
  const base = (voiceA + digA) * cov * lang / (1 - SZ.shrink / 100);
  const fte = [Math.max(1, Math.round(base * 0.8)), Math.max(1, Math.round(base * 1.1))];
  const seats = [Math.max(1, Math.round(fte[0] / Math.max(1, cov) * 1.05)), Math.max(1, Math.round(fte[1] / Math.max(1, cov) * 1.1))];
  const r = RATES[SZ.rate]; return { fte, seats, val: [seats[0] * r[0] * 12, seats[1] * r[1] * 12], voiceA, digA };
}
function viewSizer() {
  const r = sizeCalc();
  const sl = (k, label, min, max, step) => `<div class="slider"><label for="sz_${k}">${esc(label)}</label><output class="num" id="o_${k}">${new Intl.NumberFormat("en").format(SZ[k])}</output><input type="range" id="sz_${k}" data-sz="${k}" min="${min}" max="${max}" step="${step}" value="${SZ[k]}"></div>`;
  const opts = S.deals.filter((d) => (d.status || "open") === "open").map((d) => `<option value="${esc(d.id)}">${esc(d.title)}</option>`).join("");
  return `<div class="sizer"><section class="panel card"><h1 style="font-size:24px">${esc(t("sizer_h"))}</h1><p style="margin:0;color:var(--ink-3)">${esc(t("sizer_sub"))}</p>
    ${sl("vol", t("volume"), 2000, 400000, 1000)}${sl("voice", t("voice"), 0, 100, 5)}${sl("aht", t("aht"), 60, 900, 10)}${sl("hours", t("hours"), 6, 24, 1)}${sl("days", t("days"), 5, 7, 1)}${sl("sl", t("sl"), 60, 95, 5)}${sl("shrink", t("shrink"), 15, 45, 1)}${sl("langs", t("langs"), 1, 5, 1)}
    <label class="field"><span class="label">${esc(t("rate"))}</span><select id="szRate">${Object.entries(RATES).map(([c, v]) => `<option value="${c}" ${SZ.rate === c ? "selected" : ""}>${esc(L(...COUNTRY[c]))} · ${v[0]}–${v[1]}</option>`).join("")}</select></label></section>
    <section class="panel card" aria-live="polite"><div class="label">${esc(t("fte"))}</div><div class="big" id="szFte">${r.fte[0]}–${r.fte[1]}</div>
      <div class="label">${esc(t("seats"))}</div><div class="big" id="szSeats" style="font-size:28px">${r.seats[0]}–${r.seats[1]}</div>
      <div class="label">${esc(t("annual"))}</div><div class="big" id="szVal" style="font-size:28px;color:var(--brass)">${money(r.val[0])} – ${money(r.val[1]).replace(/^\w+ /, "")}</div>

      ${opts ? `<div class="row"><select id="szDeal" class="btn" aria-label="Deal">${opts}</select><button class="btn primary" id="szApply">${esc(t("applyTo"))}</button></div>` : ""}</section></div>`;

Concentrix offers to position (do not overclaim):\n${offers || "managed customer experience services"}

/* ---------------- downloads ---------------- */
async function exportCsv() {
  const cols = ["Title", "Organisation", "Stage", "Status", "Value USD", "Value " + S.cur, "Expected close", "Next step", "Next step date", "Health", "Health reasons", "Source", "Economic buyer", "Champion", "Compelling event"];
  const q = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = S.deals.map((d) => { const h = health(d); return [d.title, d.org, stageOf(d.stage).en, d.status || "open", Math.round(d.valueUsd || 0), Math.round((d.valueUsd || 0) * FX[S.cur]), d.closeDate, d.nextStep, d.nextDate, h.status, h.reasons.join("; "), d.source, d.eb, d.champion, d.event]; });
  try { await S.downloads.save({ filename: `meridian-pipeline-${today()}.csv`, data: "﻿" + [cols, ...rows].map((r) => r.map(q).join(",")).join("\n") }); } catch (e) { if (e?.code !== "declined") toast(e?.message || "Download failed"); }
}
async function downloadBrief() {
  const doc = $("#briefDoc").cloneNode(true); doc.querySelectorAll("button").forEach((b) => b.remove());
  const css = [...document.querySelectorAll("style")].map((s) => s.textContent).join("\n");
  const html = `<!doctype html><html lang="${S.lang}" dir="${S.lang === "ar" ? "rtl" : "ltr"}"><head><meta charset="utf-8"><title>Monday Brief ${today()}</title><style>${css}</style></head><body style="background:#fff">${doc.outerHTML}</body></html>`;
  try { await S.downloads.save({ filename: `monday-brief-${today()}.html`, data: html }); } catch (e) { if (e?.code !== "declined") toast(e?.message || "Download failed"); }
}

/* ---------------- keyboard + routing ---------------- */
addEventListener("keydown", (e) => {
  if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Escape") return closeLayer();
  if (S.view !== "radar") return;
  const k = e.key.toLowerCase();
  if (k === "j") next(1); else if (k === "k") next(-1);
  else if (k === "a" && playStatus(S.plays.find((p) => p.id === S.sel) || {}) === "new") act("accept");
  else if (k === "s") act("snooze"); else if (k === "c") copyOut();
});
function route() { const h = location.hash.slice(1); S.view = ["markets", "opportunities", "expected", "logos", "radar", "pipeline", "brief", "sizer"].includes(h) ? h : "markets"; document.querySelectorAll(".more").forEach((d) => d.removeAttribute("open")); closeLayer(); render(); scrollTo(0, 0); }
addEventListener("hashchange", route);
$("#langBtn").onclick = () => { S.lang = S.lang === "ar" ? "en" : "ar"; keep("mer_lang", S.lang); S.outLang = null; render(); };

/* ---------------- boot ---------------- */
async function boot() {
  try { S.playState = JSON.parse(load("mer_playstate", "{}")); S.contacts = JSON.parse(load("mer_contacts", "[]")); S.deals = JSON.parse(load("mer_deals", "[]")); S.settings = JSON.parse(load("mer_settings", "{}")); } catch {}
  route();
  const [plays, offers, meta, logos, trends] = await Promise.all(["plays", "offers", "meta", "logos", "trends"].map((f) => fetch(f + ".json").then((r) => r.json()).catch(() => (f === "meta" || f === "offers" ? {} : []))));
  S.plays = plays; S.offers = offers; S.meta = meta; S.logos = logos; S.trends = trends; render();
  if (!window.claude?.use) return;
  const [db, user, sample, downloads] = await Promise.all(["db", "user", "sample", "downloads"].map((n) => window.claude.use(n).catch(() => null)));
  S.sample = sample; S.downloads = downloads; S.user = user;
  if (user) { try { S.me = await user.me(); } catch {} }
  if (db) {
    S.db = db; S.live = true; S.playState = {}; S.deals = [];
    const timer = setTimeout(() => { S.live = false; render(); }, 10000);
    db.collection("plays").onSnapshot((snap) => { clearTimeout(timer); S.live = true; S.playState = Object.fromEntries(snap.docs.map((d) => [d.id, d.data()])); render(); }, () => { S.live = false; render(); });
    db.collection("deals").onSnapshot(async (snap) => { S.deals = snap.docs.map((d) => ({ id: d.id, ...d.data() })); await resolveProfiles(); render(); }, () => { S.live = false; render(); });
    db.doc("settings/main").onSnapshot((d) => { S.settings = d.exists ? d.data() : {}; render(); });
    S.contacts = [];
    db.collection("contacts").onSnapshot((snap) => { S.contacts = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); });
  }
  render();
}
async function resolveProfiles() {
  if (!S.user?.profiles) return;
  const ids = [...new Set(S.deals.flatMap((d) => [d.owner, ...(d.history || []).map((h) => h.by)]).filter(Boolean))];
  if (!ids.length) return;
  try { S.profiles = { ...S.profiles, ...(await S.user.profiles(ids)) }; } catch {}
}
boot();
})();
</script>
